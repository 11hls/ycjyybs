  html { color-scheme: dark; }

  .page-glow {
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);

<section class="pb-24">

    <div id="doodle" class="vcard p-8">

        <span class="text-xs text-dim">得分：<span id="gameScore" class="text-brand2">0</span></span>
      </div>
      <canvas id="doodleCanvas" width="320" height="420"
        class="w-full max-w-[320px] mx-auto rounded-lg border border-line bg-bg touch-none cursor-pointer"></canvas>
      <div class="mt-4 text-center">

<footer class="border-t border-line/60 py-10">
  <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-dim">

<script>
/* 青蛙跳荷叶（模仿 Doodle Jump 难度：普通/移动/枯荷叶三档平台，随分数变难） */
const canvas = document.getElementById('doodleCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('gameScore');

const W = canvas.width, H = canvas.height;
const GRAVITY = 0.35, JUMP = -11, MOVE = 1.5;   // 跳跃高度约 173px；慢速移动让每跳水平漂移(≈95px)落在平台列覆盖(≈110px)内
const MAX_FOLLOW = 12;   // 相机平滑跟随：每 60fps 帧最多追 12px
const LOTUS_COLOR = {
  normal:  { fill: '#22c55e', edge: '#166534' },
  moving:  { fill: '#38bdf8', edge: '#1e40af' },
  fragile: { fill: '#d97706', edge: '#78350f' },
};
let lastTime = 0;

let player, platforms, score, cameraY, gameOver, keys = { left:false, right:false };

function initGame() {
  player = { x: W/2 - 10, y: H - 80, w: 20, h: 20, vy: 0 };
  platforms = [];
  score = 0; cameraY = 0; gameOver = false;
  scoreEl.textContent = '0';
  let ty = H - 40, prevX = W/2 - 55;   // 相邻平台水平偏移 ≤ 60px，保证直线上升也踩得到
  platforms.push({ x: prevX, y: ty, w: 110, type: 'normal', vx: 0, broken: false, life: 0 });
  for (let i = 1; i <= 14; i++) {
    ty -= 60 + Math.random() * 30;
    if (i % 2 === 0) prevX = Math.max(0, Math.min(W - 70, player.x + (Math.random() * 60 - 30)));   // 初始段也锚定玩家
    const p = makePlatform(ty, prevX);
    prevX = p.x;
    platforms.push(p);
  }
}

function pickType() {
  const r = Math.random();
  if (score > 800) return r < 0.25 ? 'moving' : (r < 0.40 ? 'fragile' : 'normal');
  if (score > 300) return r < 0.18 ? 'moving' : (r < 0.26 ? 'fragile' : 'normal');
  return r < 0.12 ? 'moving' : 'normal';
}

function makePlatform(y, prevX, forceEdge) {
  const type = pickType();
  let x;
  if (forceEdge) {   // 强制靠边平台：左右边缘交替，wrap 回屏后也有落脚点
    x = Math.random() < .5 ? Math.random() * 50 : W - 70 - Math.random() * 50;
  } else {
    x = prevX == null ? Math.random() * (W - 70) : prevX + (Math.random() * 120 - 60);   // 相邻平台水平偏移 ≤ 60px
  }
  x = Math.max(0, Math.min(W - 70, x));
  return {
    x, y,
    w: 70 + Math.random() * 30,
    type,
    vx: type === 'moving' ? (0.6 + Math.random() * 1.0) * (Math.random() < .5 ? -1 : 1) : 0,
    broken: false, life: 0,
  };
}

function spawnPlatforms() {
  let top = Math.min(...platforms.map(p => p.y));
  let prevX = platforms.find(p => p.y === top).x;
  let n = 0;
  while (top > -60) {   // 保证屏幕上方始终有新平台可踩
    top -= 60 + Math.random() * 30;
    // 每 2 个平台把锚点拉回玩家附近，平台列不会漂离玩家导致踩空
    if (n % 2 === 0) prevX = Math.max(0, Math.min(W - 70, player.x + (Math.random() * 60 - 30)));
    const p = makePlatform(top, prevX, n % 4 === 3);
    n++;
    prevX = p.x;
    platforms.push(p);
  }
  platforms = platforms.filter(p => p.y < H + 60 && !(p.broken && p.life <= 0));   // 清理屏幕外旧平台和碎掉的枯荷叶
}

function updateGame(dt) {
  if (gameOver) return;
  if (keys.left)  player.x -= MOVE * dt;
  if (keys.right) player.x += MOVE * dt;
  if (player.x < -player.w) player.x = W;
  if (player.x > W) player.x = -player.w;

  player.vy += GRAVITY * dt;
  player.y  += player.vy * dt;

  // 移动荷叶往返移动；碎荷叶淡出计时
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.x += p.vx * dt;
      if (p.x < 0) p.vx = Math.abs(p.vx);
      if (p.x + p.w > W) p.vx = -Math.abs(p.vx);
    }
    if (p.broken) p.life -= dt;
  }
  platforms = platforms.filter(p => !(p.broken && p.life <= 0));   // 碎裂动画结束立即移除
  if (player.vy > 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (player.x + player.w > p.x - 6 && player.x < p.x + p.w + 6 &&   // 水平 ±6px 容错，边缘擦过也能接住（Doodle 手感）
          player.y + player.h > p.y && player.y + player.h - player.vy * dt <= p.y + 6) {
        if (p.type === 'fragile') {   // 枯荷叶：一踩就碎，不反弹
          p.broken = true; p.life = 16;
          break;
        }
        player.vy = JUMP;
        break;
      }
    }
  }
  const line = H * 0.4;   // 跟随线固定在屏幕 40% 高度（原 bug：line= cameraY+H*0.4 混用世界/屏幕坐标，跟随线会漂出屏幕，导致小球跑出屏外视角也不跟）
  if (player.y < line) {
    // 平滑跟随：每帧最多移动 MAX_FOLLOW*dt，视角不会瞬移甩开小球
    const dy = Math.min(line - player.y, MAX_FOLLOW * dt);
    cameraY -= dy;
    player.y += dy;
    platforms.forEach(p => p.y += dy);
    score += Math.round(dy);
    scoreEl.textContent = score;
    spawnPlatforms();
  }
  if (player.y > H + 40) {   // 掉出屏幕底部判定（屏幕坐标）
    gameOver = true;
  }
}

function drawLotus(p) {
  const c = LOTUS_COLOR[p.type] || LOTUS_COLOR.normal;
  const h = 10;
  const cx = p.x + p.w / 2, cy = p.y + h / 2;
  const fade = p.broken ? Math.max(p.life / 16, 0.15) : 1;
  const scale = p.broken ? Math.max(p.life / 16, 0.05) : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  // 叶身
  ctx.fillStyle = c.fill;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = c.edge;
  ctx.lineWidth = 1;
  ctx.stroke();
  // V 形缺口（右上）
  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.moveTo(p.w / 2 - 6, -h / 2 + 1);
  ctx.lineTo(p.w / 2 - 1, 0);
  ctx.lineTo(p.w / 2 - 12, -h / 2 + 1);
  ctx.closePath();
  ctx.fill();
  // 叶脉
  ctx.strokeStyle = c.edge;
  ctx.globalAlpha *= 0.55;
  ctx.beginPath();
  ctx.moveTo(-p.w / 2 + 2, 0);
  ctx.lineTo(p.w / 2 - 4, 0);
  ctx.stroke();
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-i * p.w / 7, -h / 2 + 1);
    ctx.moveTo(0, 0);
    ctx.lineTo(-i * p.w / 7, h / 2 - 1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFrog() {
  const fx = player.x + player.w / 2;
  const fy = player.y + player.h;
  const stretch = player.vy < 0 ? 1.12 : player.vy > 0 ? 0.9 : 1;   // 上升拉长，下落压扁
  ctx.save();
  ctx.translate(fx, fy);
  ctx.scale(1 / stretch, stretch);
  // 后腿（上升收拢，下落张开）
  const spread = player.vy < 0 ? 6 : 11;
  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.ellipse(-9, -3, 4.5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -3, 4.5, 3, 0.5, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.ellipse(0, -8, 10, 8.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // 腹部
  ctx.fillStyle = '#bbf7d0';
  ctx.beginPath();
  ctx.ellipse(0, -5.5, 6.5, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // 凸眼 + 瞳孔
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5.5, -16, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -16, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.beginPath(); ctx.arc(-5, -15.5, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -15.5, 1.8, 0, Math.PI * 2); ctx.fill();
  // 微笑
  ctx.strokeStyle = '#14532d';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, -7, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  // 前腿
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(-8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGame() {
  ctx.clearRect(0, 0, W, H);
  // 背景网格
  ctx.strokeStyle = 'rgba(38,38,38,.6)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 荷叶平台
  platforms.forEach(p => {
    if (p.y > -20 && p.y < H + 20 && !(p.broken && p.life <= 0)) drawLotus(p);
  });

  // 青蛙主角
  drawFrog();

  if (gameOver) {
    ctx.fillStyle = 'rgba(9,9,11,.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#a3a3a3';
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('掉水里啦！得分 ' + score, W/2, H/2 - 10);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('点击画布重新开始', W/2, H/2 + 16);
  }
}

function loop(t) {
  // 帧率归一化：以 60fps 为基准，高分屏(120/144Hz)不再让游戏速度翻倍
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / (1000 / 60);
  lastTime = t;
  if (dt < 0.001) dt = 0.001;
  if (dt > 3) dt = 3;   // 切后台回来时防止巨帧跳变
  updateGame(dt);
  drawGame();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
canvas.addEventListener('pointerdown', e => {
  if (gameOver) { initGame(); return; }
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  if (cx < rect.width / 2) keys.left = true; else keys.right = true;
});
canvas.addEventListener('pointerup', () => { keys.left = false; keys.right = false; });
canvas.addEventListener('pointerleave', () => { keys.left = false; keys.right = false; });
document.getElementById('gameReset').addEventListener('click', initGame);

initGame();
requestAnimationFrame(loop);   // 直接交给 rAF 启动，确保首帧拿到时间戳（同步调 loop() 会因 t=undefined 拿到 NaN 的 dt）
</script>
