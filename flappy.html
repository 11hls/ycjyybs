<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一只蛙的数值崩坏</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0f172a;
    background-image:radial-gradient(ellipse at 50% -20%, rgba(34,197,94,.14), transparent 60%);
    color:#e2e8f0;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; overflow:hidden;
  }
  .wrap {
    display:flex; align-items:stretch; justify-content:center;
    gap:28px; flex-wrap:wrap;
  }
  .main { display:flex; flex-direction:column; align-items:center; gap:14px; }
  h1 {
    font-size:20px; font-weight:600; letter-spacing:2px;
    color:#f0fdf4;
    text-shadow:0 2px 12px rgba(34,197,94,.35);
  }
  h1 small { font-size:12px; font-weight:400; color:#7dd3a8; letter-spacing:1px; margin-left:8px; }
  .stage {
    position:relative; display:inline-block;
    width:min(560px, 92vw, calc((100vh - 150px) * 2 / 3));
    border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08);
    background:#bae6fd;
    touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  canvas { display:block; width:100%; height:auto; }
  #hud {
    position:absolute; top:14px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 16px;
    font-size:30px; font-weight:700; color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.35), 0 0 2px rgba(0,0,0,.4);
    pointer-events:none; z-index:5; letter-spacing:2px;
  }
  #hud.ready { font-size:18px; top:20px; color:#fff; opacity:.92; font-weight:500; letter-spacing:1px; }
  #hudHearts { font-size:20px; letter-spacing:3px; text-shadow:0 2px 8px rgba(0,0,0,.45); }
  #startHint {
    position:absolute; bottom:70px; left:0; right:0; text-align:center;
    color:#fff; font-size:15px; font-weight:500; letter-spacing:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    pointer-events:none; z-index:5;
    animation:pulse 1.6s ease-in-out infinite;
    transition:opacity .2s;
  }
  #startHint.hidden { opacity:0; animation:none; }
  @keyframes pulse { 0%,100%{opacity:.95} 50%{opacity:.45} }
  .overlay {
    position:absolute; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center;
    background:rgba(8,15,12,.55); backdrop-filter:blur(4px);
    pointer-events:none;
  }
  .overlay.show { display:flex; pointer-events:auto; }
  .panel {
    width:calc(100% - 48px); max-width:330px; max-height:88%;
    overflow-y:auto;
    background:rgba(20,30,24,.92);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:20px 18px 18px;
    text-align:center;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.7);
  }
  .p-title { font-size:20px; font-weight:600; color:#f0fdf4; }
  .p-score { margin-top:6px; font-size:34px; font-weight:700; color:#4ade80; }
  .p-score b { font-size:44px; }
  .submit-row { margin-top:14px; display:flex; gap:8px; }
  .submit-row input {
    flex:1; min-width:0; padding:9px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07);
    color:#f0fdf4; font-size:14px; outline:none; text-align:center;
  }
  .submit-row input::placeholder { color:#8a978f; }
  .submit-row input:focus { border-color:#4ade80; background:rgba(255,255,255,.1); }
  .p-rank {
    display:none; margin-top:12px; padding:10px 12px;
    border-radius:10px; background:rgba(74,222,128,.12);
    border:1px solid rgba(74,222,128,.45);
    color:#4ade80; font-size:14px; font-weight:600; letter-spacing:1px;
  }
  .p-rank.show { display:block; animation:pkIn .4s ease; }
  @keyframes pkIn { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  .toast-msg {
    display:none; margin-bottom:10px; padding:8px 12px; border-radius:8px;
    background:rgba(248,113,113,.18); border:1px solid rgba(248,113,113,.5);
    color:#f87171; font-size:13px; font-weight:600; letter-spacing:1px;
    animation:toastIn .25s ease;
  }
  .toast-msg.show { display:block; }
  @keyframes toastIn { from { transform:translateY(-6px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .submit-row button {
    padding:9px 14px; border-radius:10px; border:none; cursor:pointer;
    background:#22c55e; color:#052e16; font-size:14px; font-weight:600;
    transition:background .15s;
  }
  .submit-row button:hover { background:#4ade80; }
  .submit-row button:disabled { background:#4a5a50; color:#9aa8a0; cursor:default; }
  .board { margin-top:16px; text-align:left; }
  .board-title { font-size:13px; font-weight:600; color:#a7f3d0; letter-spacing:1px; margin-bottom:8px; }
  .rankList { list-style:none; font-size:13px; flex:1; display:grid; grid-template-rows:repeat(10, 1fr); gap:2px; }
  .rankList li {
    display:flex; align-items:center; gap:8px;
    padding:6px 8px; border-radius:8px; color:#dbe5de;
  }
  .rankList li:nth-child(1) { background:rgba(250,204,21,.14); color:#fde68a; }
  .rankList li:nth-child(2) { background:rgba(203,213,225,.12); color:#e2e8f0; }
  .rankList li:nth-child(3) { background:rgba(217,119,6,.16); color:#fdba74; }
  .rankList li.me { outline:1px solid #4ade80; }
  .rankList .rk { width:22px; text-align:right; flex-shrink:0; color:#8a978f; }
  .rankList .rk.top { color:inherit; font-weight:600; }
  .rankList .nk { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .rankList .sc { font-weight:600; color:#fff; font-size:12px; white-space:nowrap; }
  .rankList .empty { color:#8a978f; text-align:center; padding:8px 0; }
  .rankList li.empty-slot { color:#55635b; font-style:italic; }
  .rankList li.empty-slot .sc { color:#55635b; font-weight:400; }
  .rankList li.loading-slot { color:#64748b; }
  .rankList li.loading-slot .sc { color:#64748b; font-weight:400; }
  .restart-btn {
    margin-top:16px; width:100%; padding:11px; border-radius:12px;
    border:none; cursor:pointer;
    background:linear-gradient(180deg,#22c55e,#15803d);
    color:#fff; font-size:15px; font-weight:600; letter-spacing:3px;
    transition:filter .15s;
  }
  .restart-btn:hover { filter:brightness(1.12); }
  .foot { margin-top:2px; font-size:12px; color:#64748b; letter-spacing:1px; }
  /* ---- 道具图鉴 ---- */
  .legend {
    width:216px; padding:18px 16px 14px;
    background:rgba(15,23,42,.72);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    backdrop-filter:blur(8px);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.6);
    display:flex; flex-direction:column;
  }
  .lg-title {
    font-size:14px; font-weight:600; color:#a7f3d0;
    letter-spacing:2px; margin-bottom:14px;
    display:flex; align-items:center; gap:6px;
  }
  .lg-items { display:flex; flex-direction:column; gap:12px; flex:1; justify-content:space-evenly; }
  .lg-item { display:flex; align-items:center; gap:10px; }
  .lg-icon { width:40px; height:40px; flex-shrink:0; }
  .lg-text { display:flex; flex-direction:column; min-width:0; }
  .lg-text b { font-size:13px; color:#f0fdf4; }
  .lg-text span { font-size:11px; color:#94a3b8; line-height:1.4; }
  .lg-foot {
    margin-top:14px; padding-top:10px;
    border-top:1px dashed rgba(255,255,255,.12);
    font-size:11px; color:#7dd3a8; line-height:1.6;
    flex-shrink:0;
  }
  /* ---- 右侧排行榜 ---- */
  .board-side {
    width:240px; padding:18px 16px 14px;
    background:rgba(15,23,42,.72);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    backdrop-filter:blur(8px);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.6);
    display:flex; flex-direction:column;
  }
  .bs-title {
    font-size:14px; font-weight:600; color:#fde68a;
    letter-spacing:2px; margin-bottom:12px;
    display:flex; align-items:center; gap:6px;
  }
  .bs-title small { font-size:10px; font-weight:400; color:#94a3b8; letter-spacing:1px; margin-left:auto; }
  .bs-refresh {
    margin-top:14px; padding:7px; border-radius:9px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06); color:#e2e8f0;
    font-size:12px; cursor:pointer; transition:background .15s;
    letter-spacing:2px; flex-shrink:0;
  }
  .bs-refresh:hover { background:rgba(255,255,255,.12); }
  @media (max-width: 920px) {
    html, body { height:auto; }
    body { min-height:100vh; overflow-x:hidden; overflow-y:auto; align-items:flex-start; justify-content:center; }
    .wrap { flex-direction:column; gap:16px; }
    .main { order:1; }
    .legend { order:2; width:min(440px, 94vw); }
    .board-side { order:3; width:min(440px, 94vw); }
    .lg-items { flex-direction:row; flex-wrap:wrap; }
    .lg-item { width:calc(50% - 5px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="legend">
    <div class="lg-title">🎒 道具图鉴</div>
    <div class="lg-items">
      <div class="lg-item"><canvas class="lg-icon" data-item="coin" width="88" height="88"></canvas><div class="lg-text"><b>金币</b><span>获得穿过两次竹子的分数</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="heart" width="88" height="88"></canvas><div class="lg-text"><b>血包</b><span>回 1 滴血，满血吃分数翻倍</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="max" width="88" height="88"></canvas><div class="lg-text"><b>生质液</b><span>生命上限 +1</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="ghost" width="88" height="88"></canvas><div class="lg-text"><b>虚化药水</b><span>3秒虚化</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="plus" width="88" height="88"></canvas><div class="lg-text"><b>万年灵乳</b><span>穿过竹子的得分永久翻倍</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="double" width="88" height="88"></canvas><div class="lg-text"><b>加倍药水</b><span>当前分数直接翻倍</span></div></div>
    </div>
    <div class="lg-foot">温馨提示：道具随机刷新，位置不保证能吃得到</div>
  </aside>

  <div class="main">
  <h1>一只蛙的数值崩坏</h1>
  <div class="stage" id="stage">
    <canvas id="game" width="800" height="1200"></canvas>
    <div id="hud" class="ready"><span id="hudScore">0</span><span id="hudHearts">❤ 3/3</span></div>
    <div id="startHint">点击 / 空格 起跳</div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="toast-msg" id="toastMsg"></div>
        <div class="p-title">少侠殒命于此，是否再战？</div>
        <div class="p-score">得分 <b id="finalScore">0</b></div>
        <div class="p-rank" id="pkRank"></div>
        <div class="submit-row">
          <input id="nick" maxlength="10" placeholder="少侠，报上名来" autocomplete="off">
          <button id="submitBtn">⚔️ 上榜 PK</button>
        </div>
        <button class="restart-btn" id="restartBtn">再来一局</button>
      </div>
    </div>
  </div>
  </div>

  <aside class="board-side">
    <div class="bs-title">🏆 竹林排行榜<small>TOP10</small></div>
    <ol class="rankList" id="sideRankList"><li class="empty">加载中…</li></ol>
    <button class="bs-refresh" id="refreshBtn">刷新榜单</button>
  </aside>
</div>

<script>
'use strict';
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
ctx.scale(2, 2);   // 物理分辨率 800x1200，逻辑坐标保持 400x600，绘制代码零改动
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const hudHearts = document.getElementById('hudHearts');
const startHint = document.getElementById('startHint');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const nickInput = document.getElementById('nick');
const submitBtn = document.getElementById('submitBtn');
const sideRankList = document.getElementById('sideRankList');
const refreshBtn = document.getElementById('refreshBtn');
const pkRank = document.getElementById('pkRank');
const restartBtn = document.getElementById('restartBtn');
const toastMsg = document.getElementById('toastMsg');

const W = 400, H = 600;
const GRAVITY = 0.45, FLAP = -7.0, SCROLL = 2.2;
const PIPE_W = 56, GROUND_H = 48, PIPE_SPACING = 215;
const FROG_X = 96;
const MAX_HEARTS = 3, HURT_IMMUNE = 1.5, GHOST_MS = 3;
const MAX_LIFE_ITEM = 5;    // 生质液最多可吃数量
const MAX_HEART_ITEM = 20;  // 血包每局最多刷新数量

const frog = { y: H / 2, vy: 0, w: 32, h: 28, rot: 0, flapT: 0 };
let pipes = [], clouds = [], farHills = [], hills = [];
let items = [], floats = [];
let score = 0, state = 'ready';
let pipeMult = 1; // 万年灵乳叠加的穿竹得分倍数（初始 1 倍）
let pipeSeq = 0; // 竹子生成序号（独立计数器，不受 pipes 数组裁剪影响）
let maxHearts = MAX_HEARTS, hearts = MAX_HEARTS, invincible = 0, lifeItemLeft = MAX_LIFE_ITEM, heartItemLeft = MAX_HEART_ITEM;
let lastTime = 0, elapsed = 0, dist = 0, deadTimer = 0, submitted = false;
let overAt = 0;   // 结算面板弹出时间戳：0.6 秒内禁止空格重开，防死亡瞬间狂按误触

try { let n = localStorage.getItem('flappyNick') || ''; if (n === '测试') n = ''; nickInput.value = n; } catch (e) {}

function rand(a, b) { return a + Math.random() * (b - a); }

function initScenery() {
  clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: rand(0, W), y: rand(30, 170), s: rand(0.7, 1.3) });
  farHills = [];
  for (let i = 0; i < 4; i++) farHills.push({ x: i * 160, w: rand(220, 340), h: rand(80, 150) });
  hills = [];
  for (let i = 0; i < 3; i++) hills.push({ x: i * 240, w: rand(200, 300), h: rand(60, 130) });
}

function resetGame() {
  frog.y = H / 2; frog.vy = 0; frog.rot = 0; frog.flapT = 0;
  pipes = []; items = []; floats = [];
  score = 0; pipeMult = 1; pipeSeq = 0; deadTimer = 0; submitted = false;
  hearts = maxHearts = MAX_HEARTS; invincible = 0; lifeItemLeft = MAX_LIFE_ITEM; heartItemLeft = MAX_HEART_ITEM;
  renderHearts();
  overlay.classList.remove('show');
  pkRank.classList.remove('show');
  submitBtn.disabled = false; submitBtn.textContent = '⚔️ 上榜 PK';
  state = 'ready';
  startHint.classList.remove('hidden');
  hud.classList.add('ready');
  renderScore();   // score 已归零，此处同时复位自适应字号
}

function randomGap() {
  // 分四档：超窄 / 窄 / 普通 / 宽，视觉差异明显
  const r = Math.random();
  if (r < 0.12) return 95 + Math.random() * 10;   // 超窄：95~105（极限）
  if (r < 0.40) return 115 + Math.random() * 20;  // 窄：115~135（挑战）
  if (r < 0.75) return 145 + Math.random() * 25;  // 中：145~170
  return 175 + Math.random() * 20;                // 宽：175~195（奖励）
}

function pipeParams(prev) {
  const gap = randomGap();
  let c;
  if (prev == null) c = 130 + Math.random() * 260; // 第一根中心：130~390
  else c = prev.gapC + rand(-150, 150);            // 相邻落差：高低起伏
  // 上下竹段各留至少 70px 可视高度，不会出现"只有半根竹子"
  c = Math.max(gap / 2 + 70, Math.min(H - GROUND_H - gap / 2 - 70, c));
  return { gapC: c, gap };
}

function spawnPipe() {
  const prev = pipes.length ? pipes[pipes.length - 1] : null;
  const params = pipeParams(prev);
  pipes.push({ x: W + 20, ...params, scored: false });
  pipeSeq++;
  // 每两根竹子（第 2、4、6…根）之间的水平空隙刷一个道具
  // 用独立序号判断：pipes.length 会因竹子移出屏幕被裁剪，奇偶性会乱
  if (pipeSeq % 2 === 0) {
    let tp = pickItemType();
    if (tp === 'heart' && heartItemLeft <= 0) tp = 'coin'; // 血包本局已刷满 20 个，改为金币
    else if (tp === 'heart') heartItemLeft--;
    items.push({
      x: W + 20 - PIPE_SPACING / 2 + PIPE_W / 2,   // 左右两根竹子的空隙正中间
      y: rand(60, H - GROUND_H - 60),              // 可飞行区随机高度，要主动去吃
      type: tp, t: rand(0, 60)
    });
  }
}

function pickItemType() {
  const r = Math.random();
  if (r < 0.34) return 'coin';      // 金币：获得穿过两次竹子的分数
  if (r < 0.46) return 'heart';     // 血包：+1 血
  if (r < 0.62) return 'ghost';     // 虚化药水：3 秒护盾（紫瓶）
  if (r < 0.78) return 'plus';      // 万年灵乳：穿竹得分永久翻倍（绿瓶 ×2）
  if (r < 0.90) return 'double';    // 加倍药水：分数直接翻倍（橙瓶 ×2）
  // 生质液：生命上限 +1（粉瓶 ♥）；吃满 5 个后不再刷新，原位置变为万年灵乳
  return lifeItemLeft <= 0 ? 'plus' : 'max';
}

function renderHearts() {
  hudHearts.textContent = '❤ ' + hearts + '/' + maxHearts;
}

function renderScore() {
  const s = String(score);
  hudScore.textContent = s;
  // 分数很长时自动缩小字号，避免挤压右侧血量显示
  hudScore.style.fontSize = s.length >= 10 ? '16px' : s.length >= 8 ? '22px' : '';
}

function addFloat(x, y, text, color, life) {
  const L = 96;  // 96 帧 ≈ 1.6 秒（dt 单位为帧，60fps 下 1 帧 = 1/60 秒）
  floats.push({ x, y, text, color, life: L, maxLife: L });
}

function applyItem(it) {
  if (it.type === 'coin') {
    score += 2 * pipeMult;                    // 金币：获得穿过两次竹子的分数
    renderScore();
    addFloat(it.x, it.y - 14, '+' + (2 * pipeMult), '#fde047', 1);
  } else if (it.type === 'heart') {
    if (hearts < maxHearts) {
      hearts++;
      renderHearts();
      addFloat(it.x, it.y - 14, '+1 ♥', '#fca5a5', 1);
    } else {
      score *= 2;
      renderScore();
      addFloat(it.x, it.y - 14, '×2', '#fca5a5', 1);
    }
  } else if (it.type === 'ghost') {
    invincible = Math.max(invincible, GHOST_MS);
    addFloat(it.x, it.y - 14, '虚化!', '#c4b5fd', 1.2);
  } else if (it.type === 'plus') {
    pipeMult *= 2;                    // 穿竹得分永久翻倍
    addFloat(it.x, it.y - 14, '穿竹翻倍!', '#4ade80', 1.2);
  } else if (it.type === 'max') {
    if (lifeItemLeft > 0 && maxHearts < 8) {
      lifeItemLeft--;                   // 最多吃 5 个，吃满后不再加上限
      maxHearts++; hearts++;            // 生命上限 +1，同时回 1 滴
      renderHearts();
      addFloat(it.x, it.y - 14, '上限+1 ♥', '#f9a8d4', 1.2);
      // 吃满第 5 个：明确告知后续道具变化（图鉴不再写数量限制）
      if (lifeItemLeft === 0) addFloat(it.x, it.y - 38, '生质液已吃满，之后改刷万年灵乳', '#4ade80', 1.5);
    } else {
      score += 2;
      renderScore();
      addFloat(it.x, it.y - 14, '+2', '#fde047', 1);
    }
  } else if (it.type === 'double') {
    score *= 2;                       // 当前分数直接翻倍
    renderScore();
    addFloat(it.x, it.y - 14, '×2!', '#fb923c', 1.2);
  }
}

function hurt() {
  hearts--;
  renderHearts();
  addFloat(FROG_X + 16, frog.y - 4, '-1 ♥', '#f87171', 1);
  if (hearts <= 0) { die(); return; }
  invincible = HURT_IMMUNE;
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    hud.classList.remove('ready');
    renderScore();
    startHint.classList.add('hidden');
  }
  if (state === 'playing') {
    frog.vy = FLAP;
    frog.flapT = 1;
  }
}

function die() {
  state = 'dead';
  frog.vy = Math.min(frog.vy, 0) - 1.5;  // 碰撞后先小弹一下再坠落
}

function update(dt) {
  elapsed += dt;

  if (state === 'ready') {
    frog.y = H / 2 + Math.sin(elapsed * 0.004) * 8;
    frog.rot = Math.sin(elapsed * 0.004) * 0.06;
    dist += SCROLL * dt * 0.5;
    return;
  }

  if (state === 'playing' || state === 'dead') {
    frog.vy += GRAVITY * dt;
    frog.y += frog.vy * dt;
    frog.flapT = Math.max(0, frog.flapT - dt * 0.06);
    if (state === 'playing') {
      frog.rot += (frog.vy < -1 ? -0.22 : 0.05) * dt;
      frog.rot = Math.max(-0.35, Math.min(1.25, frog.rot));
    } else {
      frog.rot += 0.11 * dt;
    }
    dist += SCROLL * dt;
  }

  if (state === 'playing') {
    invincible = Math.max(0, invincible - dt / 60);   // dt 为帧，/60 换算秒
    // 管道移动 + 得分
    for (const p of pipes) p.x -= SCROLL * dt;
    pipes = pipes.filter(p => p.x > -PIPE_W - 10);
    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING + 20) spawnPipe();
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < FROG_X) { p.scored = true; score += pipeMult; renderScore(); }
    }
    // 道具：移动 + 吃到
    for (const it of items) {
      it.x -= SCROLL * dt;
      it.t += dt;
    }
    items = items.filter(i => i.x > -30);
    for (const it of items) {
      const dx = Math.abs(it.x - (FROG_X + frog.w / 2));
      const dy = Math.abs(it.y - (frog.y + frog.h / 2));
      if (dx < 20 && dy < 24) { applyItem(it); it.dead = true; }
    }
    items = items.filter(i => !i.dead);
    // 飘字动画
    for (const f of floats) { f.life -= dt; f.y -= 0.6 * dt; }
    floats = floats.filter(f => f.life > 0);
    // 碰撞：竹子（虚化免疫）
    if (invincible <= 0) {
      for (const p of pipes) {
        if (FROG_X + frog.w > p.x && FROG_X < p.x + PIPE_W) {
          const top = p.gapC - p.gap / 2, bot = p.gapC + p.gap / 2;
          if (frog.y < top || frog.y + frog.h > bot) {
            hurt();
            if (state !== 'dead') frog.vy = -3;   // 撞竹弹开
            break;
          }
        }
      }
      // 碰撞：地面（掉血 + 弹起），天花板（顶住不掉血）
      if (frog.y + frog.h > H - GROUND_H) {
        frog.y = H - GROUND_H - frog.h;
        if (frog.vy > 0) frog.vy = 0;
        if (invincible <= 0) { hurt(); if (state !== 'dead') frog.vy = -6; }
      }
      if (frog.y < -26) { frog.y = -26; frog.vy = 0; }
    } else {
      // 虚化期间物理边界仍生效（不扣血）
      if (frog.y + frog.h > H - GROUND_H) { frog.y = H - GROUND_H - frog.h; frog.vy = 0; }
      if (frog.y < -26) { frog.y = -26; frog.vy = 0; }
    }
  } else if (state === 'dead') {
    deadTimer += dt;
    for (const f of floats) { f.life -= dt; f.y -= 0.6 * dt; }
    floats = floats.filter(f => f.life > 0);
    if (frog.y + frog.h > H - GROUND_H) {
      frog.y = H - GROUND_H - frog.h;
      state = 'over';
      showOverlay();
    }
  }
}

/* ---------- 绘制 ---------- */

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8ecdf5');
  g.addColorStop(0.62, '#c8e9fb');
  g.addColorStop(1, '#e6f6e0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const c of clouds) {
    const cx = ((c.x - dist * 0.3) % (W + 120) + W + 120) % (W + 120) - 60;
    ctx.beginPath();
    ctx.ellipse(cx, c.y, 26 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 20 * c.s, c.y + 4 * c.s, 18 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 20 * c.s, c.y + 5 * c.s, 15 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFarMountains() {
  // 淡青远山，低对比，两层纵深
  ctx.fillStyle = 'rgba(155,205,175,.38)';
  for (const f of farHills) {
    const fx = ((f.x - dist * 0.12) % (W + 400) + W + 400) % (W + 400) - 200;
    ctx.beginPath();
    ctx.moveTo(fx, H - GROUND_H);
    ctx.quadraticCurveTo(fx + f.w / 2, H - GROUND_H - f.h, fx + f.w, H - GROUND_H);
    ctx.lineTo(fx + f.w, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawHills() {
  ctx.fillStyle = 'rgba(84,150,84,.35)';
  for (const h of hills) {
    const hx = ((h.x - dist * 0.5) % (W + 320) + W + 320) % (W + 320) - 160;
    ctx.beginPath();
    ctx.moveTo(hx, H - GROUND_H);
    ctx.quadraticCurveTo(hx + h.w / 2, H - GROUND_H - h.h, hx + h.w, H - GROUND_H);
    ctx.lineTo(hx + h.w, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBambooSegment(x, topY, bottomY) {
  if (topY >= H - GROUND_H || bottomY <= 0) return;
  // 竹竿本体：黄绿渐变（偏黄，和青蛙的翠绿区分开）
  const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  g.addColorStop(0, '#a3b84f');
  g.addColorStop(0.4, '#c4d76b');
  g.addColorStop(1, '#7d9440');
  ctx.fillStyle = g;
  ctx.fillRect(x, topY, PIPE_W, bottomY - topY);
  // 竹竿凹槽纹理（每节两条竖线）
  ctx.strokeStyle = 'rgba(60,80,25,.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + PIPE_W * 0.32, topY); ctx.lineTo(x + PIPE_W * 0.32, bottomY);
  ctx.moveTo(x + PIPE_W * 0.68, topY); ctx.lineTo(x + PIPE_W * 0.68, bottomY);
  ctx.stroke();
  // 竹节环：浅色凸起 + 上下深色收边
  const seg = 44;
  const start = Math.ceil(topY / seg) * seg;
  for (let y = start; y < bottomY; y += seg) {
    ctx.fillStyle = 'rgba(215,228,158,.55)';
    ctx.fillRect(x + 2, y - 3, PIPE_W - 4, 6);
    ctx.strokeStyle = 'rgba(45,65,18,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 2, y - 3); ctx.lineTo(x + PIPE_W - 2, y - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + PIPE_W - 2, y + 3); ctx.stroke();
  }
  // 两侧深色描边：边界和碰撞完全一致
  ctx.strokeStyle = 'rgba(30,50,18,.9)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, topY, PIPE_W - 2, bottomY - topY);
}

function drawPipes() {
  for (const p of pipes) {
    const top = p.gapC - p.gap / 2, bot = p.gapC + p.gap / 2;
    drawBambooSegment(p.x, -4, top);
    drawBambooSegment(p.x, bot, H - GROUND_H + 4);
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCoin(x, y, t) {
  const sq = 1 + Math.sin(t * 0.18) * 0.1;   // 呼吸缩放
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sq, sq);
  // 金色圆 + 高光
  const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 12);
  g.addColorStop(0, '#fde68a');
  g.addColorStop(1, '#d97706');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2; ctx.stroke();
  // 铜钱方孔
  ctx.fillStyle = '#b45309';
  ctx.fillRect(-3.5, -3.5, 7, 7);
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1;
  ctx.strokeRect(-3.5, -3.5, 7, 7);
  ctx.restore();
}

function drawHeart(x, y, t) {
  const s = 1 + Math.sin(t * 0.2) * 0.08;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-10, -3, -7, -10, 0, -4);
  ctx.bezierCurveTo(7, -10, 10, -3, 0, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.arc(-3, -4, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGhost(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(167,139,250,.9)';
  ctx.shadowBlur = 12;
  // 药水瓶身
  ctx.fillStyle = 'rgba(139,92,246,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  // 瓶颈
  ctx.fillStyle = '#a78bfa';
  ctx.fillRect(-3.5, -7, 7, 5);
  // 瓶塞
  ctx.fillStyle = '#6d28d9';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // 问号
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 2.5);
  ctx.restore();
}

function drawPlusPotion(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(74,222,128,.9)';
  ctx.shadowBlur = 12;
  // 绿色药水瓶身：万年灵乳（穿竹得分永久翻倍）
  ctx.fillStyle = 'rgba(34,197,94,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(-3.5, -7, 7, 5);
  ctx.fillStyle = '#15803d';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // "×2" 标记
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('×2', 0, 2.5);
  ctx.restore();
}

function drawDoublePotion(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(251,146,60,.9)';
  ctx.shadowBlur = 12;
  // 橙色药水瓶身：加倍（×2）
  ctx.fillStyle = 'rgba(249,115,22,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  ctx.fillStyle = '#fb923c';
  ctx.fillRect(-3.5, -7, 7, 5);
  ctx.fillStyle = '#c2410c';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // "×2" 标记
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('×2', 0, 2.5);
  ctx.restore();
}

function drawMaxPotion(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(139,92,246,.9)';
  ctx.shadowBlur = 12;

  // 玻璃瓶身（浅青蓝透明）
  ctx.fillStyle = 'rgba(165,243,252,.32)';
  ctx.beginPath();
  ctx.moveTo(-3, -9);
  ctx.lineTo(3, -9);
  ctx.lineTo(5.5, 2);
  ctx.arc(0, 2, 8, 0, Math.PI, false);
  ctx.lineTo(-5.5, 2);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(165,243,252,.75)';
  ctx.stroke();

  // 瓶内双珠：生质液主体（蓝色珠子）
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.arc(-3, 3.5, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0ea5e9';
  ctx.beginPath(); ctx.arc(3, 3.5, 3.6, 0, Math.PI * 2); ctx.fill();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(-4, 2.2, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2, 2.2, 1.2, 0, Math.PI * 2); ctx.fill();

  // 软木塞/瓶盖
  ctx.fillStyle = '#78350f';
  ctx.fillRect(-4, -13, 8, 4);

  ctx.restore();
}

function drawItems() {
  for (const it of items) {
    if (it.type === 'coin') drawCoin(it.x, it.y, it.t);
    else if (it.type === 'heart') drawHeart(it.x, it.y, it.t);
    else if (it.type === 'ghost') drawGhost(it.x, it.y, it.t);
    else if (it.type === 'plus') drawPlusPotion(it.x, it.y, it.t);
    else if (it.type === 'max') drawMaxPotion(it.x, it.y, it.t);
    else drawDoublePotion(it.x, it.y, it.t);
  }
}

function drawFloats() {
  for (const f of floats) {
    const t = f.maxLife ? f.life / f.maxLife : 0;   // 1 → 0
    ctx.globalAlpha = t > 0.55 ? 1 : Math.max(0, t / 0.55);  // 前 55% 不透明，后 45% 平滑淡出
    ctx.fillStyle = f.color;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawFrog() {
  const fx = FROG_X + frog.w / 2;
  const fy = frog.y + frog.h / 2;
  const stretch = 1 + frog.flapT * 0.14;
  if (invincible > 0) ctx.globalAlpha = Math.sin(elapsed * 0.45) > 0 ? 0.35 : 0.8;
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(frog.rot);
  ctx.scale(2 - stretch, stretch);
  // 后腿（点击时收拢，下落张开）
  const spread = frog.flapT > 0.3 ? 5 : 9;
  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.ellipse(-9, -3, 4.5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -3, 4.5, 3, 0.5, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.ellipse(0, -8, 10, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(6,78,59,.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // 腹部
  ctx.fillStyle = '#bbf7d0';
  ctx.beginPath(); ctx.ellipse(0, -5.5, 6.5, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 凸眼 + 瞳孔（扑腾时睁大）
  const pr = frog.flapT > 0.3 ? 4.6 : 4;
  const cw = frog.flapT > 0.3 ? 2.2 : 1.8;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5.5, -16, pr, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -16, pr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.beginPath(); ctx.arc(-5, -15.5, cw, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -15.5, cw, 0, Math.PI * 2); ctx.fill();
  // 微笑
  ctx.strokeStyle = '#064e3b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -9, 5, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  // 前腿
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(-8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawGround() {
  ctx.fillStyle = '#4d7c0f';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#65a30d';
  ctx.fillRect(0, H - GROUND_H, W, 8);
  ctx.strokeStyle = 'rgba(236,253,245,.5)';
  ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 46) {
    const gx = ((x - dist) % (W + 92) + W + 92) % (W + 92) - 46;
    ctx.beginPath();
    ctx.moveTo(gx, H - 30);
    ctx.lineTo(gx - 6, H - 20);
    ctx.moveTo(gx, H - 30);
    ctx.lineTo(gx + 6, H - 20);
    ctx.stroke();
  }
}

function draw() {
  drawSky();
  drawClouds();
  drawFarMountains();
  drawHills();
  drawPipes();
  drawItems();
  drawFrog();
  drawFloats();
  drawGround();
}

function loop(t) {
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / (1000 / 60);
  lastTime = t;
  if (dt > 3) dt = 3;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 排行榜（右侧常驻面板 + 结算弹窗共用，只显示前十名） ---------- */

// 本地降级榜：直接双击打开 html（无后端）时用 localStorage 兜底，PK 照样能玩
const LS_BOARD = 'flappyLocalBoard';
let apiBroken = false;
let lastTryOnline = 0;   // 上次尝试线上的时间戳：降级期间每 30 秒重试一次，成功自动恢复

function readLocalBoard() {
  try { return JSON.parse(localStorage.getItem(LS_BOARD) || '[]') || []; } catch (e) { return []; }
}
function writeLocalBoard(arr) {
  try { localStorage.setItem(LS_BOARD, JSON.stringify(arr.slice(0, 50))); } catch (e) {}
}
function topTen(arr) {
  // 同名去重：保留最高分
  const map = {};
  for (const r of arr) {
    if (!map[r.nick] || r.score > map[r.nick].score) map[r.nick] = r;
  }
  return Object.values(map).sort((a, b) => b.score - a.score).slice(0, 10);
}

function renderBoard(list, olEl, loading) {
  const me = (nickInput.value || '').trim();
  olEl.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const li = document.createElement('li');
    const rkCls = i < 3 ? 'rk top' : 'rk';
    const row = (list && list[i]) || null;
    if (loading) {
      li.innerHTML = '<span class="' + rkCls + '">' + (i + 1) + '</span><span class="nk loading-slot">加载中…</span><span class="sc">——</span>';
    } else if (row) {
      li.innerHTML = '<span class="' + rkCls + '">' + (i + 1) + '</span><span class="nk"></span><span class="sc"></span>';
      li.querySelector('.nk').textContent = row.nick;
      li.querySelector('.sc').textContent = row.score + ' 分';
      if (me && row.nick === me) li.classList.add('me');
    } else {
      li.classList.add('empty-slot');
      li.innerHTML = '<span class="' + rkCls + '">' + (i + 1) + '</span><span class="nk">虚位以待</span><span class="sc">——</span>';
    }
    olEl.appendChild(li);
  }
}

function loadBoard(olEl) {
  // 降级期间先显示本地榜，但每 30 秒仍会重试线上（成功即恢复），不再一次失败就永久降级
  if (apiBroken && Date.now() - lastTryOnline < 30000) {
    renderBoard(topTen(readLocalBoard()), olEl);
    return;
  }
  if (apiBroken) lastTryOnline = Date.now();
  renderBoard(null, olEl, true);
  fetch('/api/scores?game=flappy&limit=10')
    .then(r => r.json().then(j => ({ status: r.status, list: j })))
    .then(({ status, list }) => {
      if (status !== 200 || !Array.isArray(list)) throw new Error('api');
      apiBroken = false;                      // 线上恢复
      renderBoard(list, olEl);
    })
    .catch(() => {
      apiBroken = true;
      if (!lastTryOnline) lastTryOnline = Date.now();
      renderBoard(topTen(readLocalBoard()), olEl);
    });
}

function showPkResult(rank) {
  let msg;
  if (!rank || rank < 1) msg = '⚔️ PK 完成，成绩已记录';
  else if (rank === 1) msg = '🏆 PK 结果：全服第 1 名，无人能敌！';
  else if (rank <= 10) msg = '⚔️ PK 结果：你排第 ' + rank + ' 名，已杀入 TOP10！';
  else msg = '⚔️ PK 结果：你排第 ' + rank + ' 名，无名小卒';
  pkRank.textContent = msg;
  pkRank.classList.add('show');
}

function showOverlay() {
  const s = String(score);
  finalScore.textContent = s;
  finalScore.style.fontSize = s.length >= 10 ? '24px' : s.length >= 8 ? '32px' : '';  // 大数字缩小防溢出
  overlay.classList.add('show');
  overAt = performance.now();
  loadBoard(sideRankList);
}

function showToast(msg) {
  toastMsg.textContent = msg;
  toastMsg.classList.add('show');
  setTimeout(() => { toastMsg.classList.remove('show'); }, 3200);
}

function submitScore() {
  const nick = nickInput.value.trim();
  if (!nick || submitted) return;
  submitted = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'PK 中…';
  try { localStorage.setItem('flappyNick', nick); } catch (e) {}

  const finish = (rank) => {
    submitBtn.textContent = '已参战';
    showPkResult(rank);
    loadBoard(sideRankList);
  };

  const resetBtn = () => { submitBtn.textContent = '⚔️ 上榜 PK'; submitBtn.disabled = false; submitted = false; };

  // 本地降级：同名去重（保留最高分）后算本地榜排名
  const localPk = () => {
    const arr = readLocalBoard();
    const idx = arr.findIndex(r => r.nick === nick);
    if (idx >= 0) {
      if (score > arr[idx].score) arr[idx].score = score;
    } else {
      arr.push({ nick: nick, score: score });
    }
    writeLocalBoard(arr);
    const map = {};
    for (const r of arr) if (!map[r.nick] || r.score > map[r.nick].score) map[r.nick] = r;
    const sorted = Object.values(map).sort((a, b) => b.score - a.score);
    finish(sorted.findIndex(r => r.nick === nick) + 1);
  };

  // 降级期间 30 秒内直接走本地榜；超过 30 秒则借用户主动提交再试一次线上
  if (apiBroken && Date.now() - lastTryOnline < 30000) { localPk(); return; }
  if (apiBroken) lastTryOnline = Date.now();

  fetch('/api/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: 'flappy', nick: nick, score: score })
  })
    .then(r => r.json().then(j => ({ status: r.status, j })))
    .then(({ status, j }) => {
      if (status === 201) { finish(j && j.rank ? j.rank : 0); }
      else if (status === 404 || status === 502) { apiBroken = true; lastTryOnline = Date.now(); localPk(); }  // 无后端，走本地榜
      else if (status === 429) { resetBtn(); showToast('提交太频繁，请稍后再试'); }
      else { resetBtn(); showToast((j && j.error) ? j.error : '上传失败：服务器错误（HTTP ' + status + '）'); }  // 透出后端错误信息（如分数超上限）
    })
    .catch(() => { resetBtn(); showToast('网络卡顿，请稍后再试'); });
}

/* ---------- 事件 ---------- */

stage.addEventListener('pointerdown', e => {
  if (state === 'over') return;   // 死亡后：不 preventDefault，让输入框/按钮正常获得焦点
  e.preventDefault();
  flap();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'over') {
      // 结算面板弹出 0.6 秒后才允许键盘重开（防死亡瞬间狂按空格误触）
      if (performance.now() - overAt > 600) resetGame();
      return;
    }
    flap();
  }
});

submitBtn.addEventListener('click', e => { e.stopPropagation(); submitScore(); });
nickInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') submitScore(); });
restartBtn.addEventListener('click', e => { e.stopPropagation(); resetGame(); });
refreshBtn.addEventListener('click', e => { e.stopPropagation(); loadBoard(sideRankList); });

initScenery();
resetGame();
paintLegendIcons();
loadBoard(sideRankList);            // 右侧排行榜常驻显示
setInterval(() => loadBoard(sideRankList), 30000);   // 30 秒自动刷新
requestAnimationFrame(loop);

/* ---------- 道具图鉴：复用游戏绘制函数，保证图标与游戏内一致 ---------- */
function paintLegendIcons() {
  document.querySelectorAll('.lg-icon').forEach(cv => {
    const lc = cv.getContext('2d');
    lc.scale(2, 2);
    lc.translate(22, 22);
    const saved = ctx;
    ctx = lc;
    const type = cv.dataset.item, t = 16;
    if (type === 'coin') drawCoin(0, 0, t);
    else if (type === 'heart') drawHeart(0, 0, t);
    else if (type === 'ghost') drawGhost(0, 0, t);
    else if (type === 'plus') drawPlusPotion(0, 0, t);
    else if (type === 'max') drawMaxPotion(0, 0, t);
    else drawDoublePotion(0, 0, t);
    ctx = saved;
  });
}
</script>
