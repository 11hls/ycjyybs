<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹间蛙跳 · Flappy 青蛙</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0f172a;
    background-image:radial-gradient(ellipse at 50% -20%, rgba(34,197,94,.14), transparent 60%);
    color:#e2e8f0;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px; overflow:hidden;
  }
  .wrap {
    display:flex; align-items:center; justify-content:center;
    gap:28px; flex-wrap:wrap;
  }
  .main { display:flex; flex-direction:column; align-items:center; gap:14px; }
  h1 {
    font-size:20px; font-weight:600; letter-spacing:2px;
    color:#f0fdf4;
    text-shadow:0 2px 12px rgba(34,197,94,.35);
  }
  h1 small { font-size:12px; font-weight:400; color:#7dd3a8; letter-spacing:1px; margin-left:8px; }
  .stage {
    position:relative; display:inline-block;
    width:min(560px, 92vw, calc((100vh - 150px) * 2 / 3));
    border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08);
    background:#bae6fd;
    touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }
  canvas { display:block; width:100%; height:auto; }
  #hud {
    position:absolute; top:14px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 16px;
    font-size:30px; font-weight:700; color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.35), 0 0 2px rgba(0,0,0,.4);
    pointer-events:none; z-index:5; letter-spacing:2px;
  }
  #hud.ready { font-size:18px; top:20px; color:#fff; opacity:.92; font-weight:500; letter-spacing:1px; }
  #hud.ready #hudHearts { opacity:.3; }
  #hudHearts { font-size:20px; letter-spacing:3px; text-shadow:0 2px 8px rgba(0,0,0,.45); }
  #startHint {
    position:absolute; bottom:70px; left:0; right:0; text-align:center;
    color:#fff; font-size:15px; font-weight:500; letter-spacing:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    pointer-events:none; z-index:5;
    animation:pulse 1.6s ease-in-out infinite;
    transition:opacity .2s;
  }
  #startHint.hidden { opacity:0; animation:none; }
  @keyframes pulse { 0%,100%{opacity:.95} 50%{opacity:.45} }
  .overlay {
    position:absolute; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center;
    background:rgba(8,15,12,.55); backdrop-filter:blur(4px);
  }
  .overlay.show { display:flex; }
  .panel {
    width:calc(100% - 48px); max-width:330px; max-height:88%;
    overflow-y:auto;
    background:rgba(20,30,24,.92);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:20px 18px 18px;
    text-align:center;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.7);
  }
  .p-title { font-size:20px; font-weight:600; color:#f0fdf4; }
  .p-score { margin-top:6px; font-size:34px; font-weight:700; color:#4ade80; }
  .p-score b { font-size:44px; }
  .p-best { margin-top:2px; font-size:13px; color:#a7b3ab; }
  .submit-row { margin-top:14px; display:flex; gap:8px; }
  .submit-row input {
    flex:1; min-width:0; padding:9px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07);
    color:#f0fdf4; font-size:14px; outline:none; text-align:center;
  }
  .submit-row input::placeholder { color:#8a978f; }
  .submit-row input:focus { border-color:#4ade80; background:rgba(255,255,255,.1); }
  .submit-row button {
    padding:9px 14px; border-radius:10px; border:none; cursor:pointer;
    background:#22c55e; color:#052e16; font-size:14px; font-weight:600;
    transition:background .15s;
  }
  .submit-row button:hover { background:#4ade80; }
  .submit-row button:disabled { background:#4a5a50; color:#9aa8a0; cursor:default; }
  .board { margin-top:16px; text-align:left; }
  .board-title { font-size:13px; font-weight:600; color:#a7f3d0; letter-spacing:1px; margin-bottom:8px; }
  #rankList { list-style:none; font-size:13px; }
  #rankList li {
    display:flex; align-items:center; gap:8px;
    padding:5px 8px; border-radius:8px; color:#dbe5de;
  }
  #rankList li:nth-child(1) { background:rgba(250,204,21,.14); color:#fde68a; }
  #rankList li:nth-child(2) { background:rgba(203,213,225,.12); color:#e2e8f0; }
  #rankList li:nth-child(3) { background:rgba(217,119,6,.16); color:#fdba74; }
  #rankList li.me { outline:1px solid #4ade80; }
  #rankList .rk { width:22px; text-align:right; flex-shrink:0; color:#8a978f; }
  #rankList .rk.top { color:inherit; font-weight:600; }
  #rankList .nk { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #rankList .sc { font-weight:600; color:#fff; }
  #rankList .empty { color:#8a978f; text-align:center; padding:8px 0; }
  .restart-btn {
    margin-top:16px; width:100%; padding:11px; border-radius:12px;
    border:none; cursor:pointer;
    background:linear-gradient(180deg,#22c55e,#15803d);
    color:#fff; font-size:15px; font-weight:600; letter-spacing:3px;
    transition:filter .15s;
  }
  .restart-btn:hover { filter:brightness(1.12); }
  .foot { margin-top:2px; font-size:12px; color:#64748b; letter-spacing:1px; }
  /* ---- 道具图鉴 ---- */
  .legend {
    width:216px; padding:18px 16px 14px;
    background:rgba(15,23,42,.72);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    backdrop-filter:blur(8px);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.6);
  }
  .lg-title {
    font-size:14px; font-weight:600; color:#a7f3d0;
    letter-spacing:2px; margin-bottom:14px;
    display:flex; align-items:center; gap:6px;
  }
  .lg-items { display:flex; flex-direction:column; gap:12px; }
  .lg-item { display:flex; align-items:center; gap:10px; }
  .lg-icon { width:40px; height:40px; flex-shrink:0; }
  .lg-text { display:flex; flex-direction:column; min-width:0; }
  .lg-text b { font-size:13px; color:#f0fdf4; }
  .lg-text span { font-size:11px; color:#94a3b8; line-height:1.4; }
  .lg-foot {
    margin-top:14px; padding-top:10px;
    border-top:1px dashed rgba(255,255,255,.12);
    font-size:11px; color:#7dd3a8; line-height:1.6;
  }
  @media (max-width: 920px) {
    .wrap { flex-direction:column; gap:16px; }
    .legend { width:min(440px, 94vw); }
    .lg-items { flex-direction:row; flex-wrap:wrap; }
    .lg-item { width:calc(50% - 5px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
  <h1>竹间蛙跳<small>Flappy Frog</small></h1>
  <div class="stage" id="stage">
    <canvas id="game" width="800" height="1200"></canvas>
    <div id="hud" class="ready"><span id="hudScore">最高 <span id="bestTop">0</span></span><span id="hudHearts">❤❤❤</span></div>
    <div id="startHint">点击 / 空格 起跳</div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="p-title">蛙蛙掉下来了</div>
        <div class="p-score">得分 <b id="finalScore">0</b></div>
        <div class="p-best">历史最高 <span id="bestScore">0</span></div>
        <div class="submit-row">
          <input id="nick" maxlength="10" placeholder="留个名字上榜" autocomplete="off">
          <button id="submitBtn">上榜</button>
        </div>
        <div class="board">
          <div class="board-title">竹林排行榜</div>
          <ol id="rankList"></ol>
        </div>
        <button class="restart-btn" id="restartBtn">再来一局</button>
      </div>
    </div>
  </div>
  <div class="foot">点击 / 空格 起跳 · 穿过竹缝 +1 · 三滴血，撞竹后虚化免疫</div>
  </div>

  <aside class="legend">
    <div class="lg-title">🎒 道具图鉴</div>
    <div class="lg-items">
      <div class="lg-item"><canvas class="lg-icon" data-item="coin" width="88" height="88"></canvas><div class="lg-text"><b>金币</b><span>吃到 +2 分</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="heart" width="88" height="88"></canvas><div class="lg-text"><b>血包</b><span>回 1 滴血，满血转 +1 分</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="ghost" width="88" height="88"></canvas><div class="lg-text"><b>虚化药水</b><span>3 秒护盾，撞竹不掉血</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="plus" width="88" height="88"></canvas><div class="lg-text"><b>加一药水</b><span>之后每根竹子永久 +1 分</span></div></div>
      <div class="lg-item"><canvas class="lg-icon" data-item="double" width="88" height="88"></canvas><div class="lg-text"><b>加倍药水</b><span>当前分数直接翻倍</span></div></div>
    </div>
    <div class="lg-foot">温馨提示：道具随机刷在竹间空隙里，位置不保证能吃得到，能吃到算赚到～</div>
  </aside>
</div>

<script>
'use strict';
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
ctx.scale(2, 2);   // 物理分辨率 800x1200，逻辑坐标保持 400x600，绘制代码零改动
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const hudScore = document.getElementById('hudScore');
const hudHearts = document.getElementById('hudHearts');
const bestTop = document.getElementById('bestTop');
const startHint = document.getElementById('startHint');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const bestScore = document.getElementById('bestScore');
const nickInput = document.getElementById('nick');
const submitBtn = document.getElementById('submitBtn');
const rankList = document.getElementById('rankList');
const restartBtn = document.getElementById('restartBtn');

const W = 400, H = 600;
const GRAVITY = 0.45, FLAP = -7.0, SCROLL = 2.2;
const PIPE_W = 56, GROUND_H = 48, PIPE_SPACING = 215;
const FROG_X = 96;
const MAX_HEARTS = 3, HURT_IMMUNE = 1.5, GHOST_MS = 3;

const frog = { y: H / 2, vy: 0, w: 32, h: 28, rot: 0, flapT: 0 };
let pipes = [], clouds = [], farHills = [], hills = [];
let items = [], floats = [];
let score = 0, best = 0, state = 'ready';
let bonus = 0;   // 加一药水叠加的每根竹子永久加分
let pipeSeq = 0; // 竹子生成序号（独立计数器，不受 pipes 数组裁剪影响）
let hearts = MAX_HEARTS, invincible = 0;
let lastTime = 0, elapsed = 0, dist = 0, deadTimer = 0, submitted = false;

try { best = parseInt(localStorage.getItem('flappyBest') || '0', 10) || 0; } catch (e) {}
try { nickInput.value = localStorage.getItem('flappyNick') || ''; } catch (e) {}

function rand(a, b) { return a + Math.random() * (b - a); }

function initScenery() {
  clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: rand(0, W), y: rand(30, 170), s: rand(0.7, 1.3) });
  farHills = [];
  for (let i = 0; i < 4; i++) farHills.push({ x: i * 160, w: rand(220, 340), h: rand(80, 150) });
  hills = [];
  for (let i = 0; i < 3; i++) hills.push({ x: i * 240, w: rand(200, 300), h: rand(60, 130) });
}

function resetGame() {
  frog.y = H / 2; frog.vy = 0; frog.rot = 0; frog.flapT = 0;
  pipes = []; items = []; floats = [];
  score = 0; bonus = 0; pipeSeq = 0; deadTimer = 0; submitted = false;
  hearts = MAX_HEARTS; invincible = 0;
  renderHearts();
  overlay.classList.remove('show');
  submitBtn.disabled = false; submitBtn.textContent = '上榜';
  state = 'ready';
  startHint.classList.remove('hidden');
  hud.classList.add('ready');
  hudScore.innerHTML = '最高 <span id="bestTop">' + best + '</span>';
}

function randomGap() {
  // 分三档：窄缝 / 普通 / 宽缝，视觉差异明显
  const r = Math.random();
  if (r < 0.3) return 115 + Math.random() * 20;   // 窄：115~135（挑战）
  if (r < 0.65) return 145 + Math.random() * 25;  // 中：145~170
  return 175 + Math.random() * 20;                // 宽：175~195（奖励）
}

function pipeParams(prev) {
  const gap = randomGap();
  let c;
  if (prev == null) c = 130 + Math.random() * 260; // 第一根中心：130~390
  else c = prev.gapC + rand(-150, 150);            // 相邻落差：高低起伏
  // 上下竹段各留至少 70px 可视高度，不会出现"只有半根竹子"
  c = Math.max(gap / 2 + 70, Math.min(H - GROUND_H - gap / 2 - 70, c));
  return { gapC: c, gap };
}

function spawnPipe() {
  const prev = pipes.length ? pipes[pipes.length - 1] : null;
  const params = pipeParams(prev);
  pipes.push({ x: W + 20, ...params, scored: false });
  pipeSeq++;
  // 每两根竹子（第 2、4、6…根）之间的水平空隙刷一个道具
  // 用独立序号判断：pipes.length 会因竹子移出屏幕被裁剪，奇偶性会乱
  if (pipeSeq % 2 === 0) {
    items.push({
      x: W + 20 - PIPE_SPACING / 2 + PIPE_W / 2,   // 左右两根竹子的空隙正中间
      y: rand(60, H - GROUND_H - 60),              // 可飞行区随机高度，要主动去吃
      type: pickItemType(), t: rand(0, 60)
    });
  }
}

function pickItemType() {
  const r = Math.random();
  if (r < 0.38) return 'coin';      // 金币：+2 分
  if (r < 0.50) return 'heart';     // 血包：+1 血
  if (r < 0.68) return 'ghost';     // 虚化药水：3 秒护盾（紫瓶 ?）
  if (r < 0.85) return 'plus';      // 加一药水：之后每根竹子永久 +1（绿瓶 +）
  return 'double';                  // 加倍药水：分数直接翻倍（橙瓶 ×2）
}

function renderHearts() {
  let s = '';
  for (let i = 0; i < MAX_HEARTS; i++) s += i < hearts ? '❤' : '🖤';
  hudHearts.textContent = s;
}

function addFloat(x, y, text, color, life) {
  floats.push({ x, y, text, color, life: life || 1 });
}

function applyItem(it) {
  if (it.type === 'coin') {
    score += 2;
    hudScore.textContent = String(score);
    addFloat(it.x, it.y - 14, '+2', '#fde047', 1);
  } else if (it.type === 'heart') {
    if (hearts < MAX_HEARTS) {
      hearts++;
      renderHearts();
      addFloat(it.x, it.y - 14, '+1 ♥', '#fca5a5', 1);
    } else {
      score += 1;
      hudScore.textContent = String(score);
      addFloat(it.x, it.y - 14, '+1', '#fde047', 1);
    }
  } else if (it.type === 'ghost') {
    invincible = Math.max(invincible, GHOST_MS);
    addFloat(it.x, it.y - 14, '虚化!', '#c4b5fd', 1.2);
  } else if (it.type === 'plus') {
    bonus += 1;                       // 之后每根竹子 +1 永久叠加
    addFloat(it.x, it.y - 14, '永久+1!', '#4ade80', 1.2);
  } else if (it.type === 'double') {
    score *= 2;                       // 当前分数直接翻倍
    hudScore.textContent = String(score);
    addFloat(it.x, it.y - 14, '×2!', '#fb923c', 1.2);
  }
}

function hurt() {
  hearts--;
  renderHearts();
  addFloat(FROG_X + 16, frog.y - 4, '-1 ♥', '#f87171', 1);
  if (hearts <= 0) { die(); return; }
  invincible = HURT_IMMUNE;
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    hud.classList.remove('ready');
    hudScore.textContent = '0';
    startHint.classList.add('hidden');
  }
  if (state === 'playing') {
    frog.vy = FLAP;
    frog.flapT = 1;
  }
}

function die() {
  state = 'dead';
  frog.vy = Math.min(frog.vy, 0) - 1.5;  // 碰撞后先小弹一下再坠落
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyBest', String(best)); } catch (e) {}
  }
}

function update(dt) {
  elapsed += dt;

  if (state === 'ready') {
    frog.y = H / 2 + Math.sin(elapsed * 0.004) * 8;
    frog.rot = Math.sin(elapsed * 0.004) * 0.06;
    dist += SCROLL * dt * 0.5;
    return;
  }

  if (state === 'playing' || state === 'dead') {
    frog.vy += GRAVITY * dt;
    frog.y += frog.vy * dt;
    frog.flapT = Math.max(0, frog.flapT - dt * 0.06);
    if (state === 'playing') {
      frog.rot += (frog.vy < -1 ? -0.22 : 0.05) * dt;
      frog.rot = Math.max(-0.35, Math.min(1.25, frog.rot));
    } else {
      frog.rot += 0.11 * dt;
    }
    dist += SCROLL * dt;
  }

  if (state === 'playing') {
    invincible = Math.max(0, invincible - dt / 60);   // dt 为帧，/60 换算秒
    // 管道移动 + 得分
    for (const p of pipes) p.x -= SCROLL * dt;
    pipes = pipes.filter(p => p.x > -PIPE_W - 10);
    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING + 20) spawnPipe();
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < FROG_X) { p.scored = true; score += 1 + bonus; hudScore.textContent = String(score); }
    }
    // 道具：移动 + 吃到
    for (const it of items) {
      it.x -= SCROLL * dt;
      it.t += dt;
    }
    items = items.filter(i => i.x > -30);
    for (const it of items) {
      const dx = Math.abs(it.x - (FROG_X + frog.w / 2));
      const dy = Math.abs(it.y - (frog.y + frog.h / 2));
      if (dx < 20 && dy < 24) { applyItem(it); it.dead = true; }
    }
    items = items.filter(i => !i.dead);
    // 飘字动画
    for (const f of floats) { f.life -= dt; f.y -= 0.6 * dt; }
    floats = floats.filter(f => f.life > 0);
    // 碰撞：竹子（虚化免疫）
    if (invincible <= 0) {
      for (const p of pipes) {
        if (FROG_X + frog.w > p.x && FROG_X < p.x + PIPE_W) {
          const top = p.gapC - p.gap / 2, bot = p.gapC + p.gap / 2;
          if (frog.y < top || frog.y + frog.h > bot) {
            hurt();
            if (state !== 'dead') frog.vy = -3;   // 撞竹弹开
            break;
          }
        }
      }
      // 碰撞：地面（掉血 + 弹起），天花板（顶住不掉血）
      if (frog.y + frog.h > H - GROUND_H) {
        frog.y = H - GROUND_H - frog.h;
        if (frog.vy > 0) frog.vy = 0;
        if (invincible <= 0) { hurt(); if (state !== 'dead') frog.vy = -6; }
      }
      if (frog.y < -26) { frog.y = -26; frog.vy = 0; }
    } else {
      // 虚化期间物理边界仍生效（不扣血）
      if (frog.y + frog.h > H - GROUND_H) { frog.y = H - GROUND_H - frog.h; frog.vy = 0; }
      if (frog.y < -26) { frog.y = -26; frog.vy = 0; }
    }
  } else if (state === 'dead') {
    deadTimer += dt;
    for (const f of floats) { f.life -= dt; f.y -= 0.6 * dt; }
    floats = floats.filter(f => f.life > 0);
    if (frog.y + frog.h > H - GROUND_H) {
      frog.y = H - GROUND_H - frog.h;
      state = 'over';
      showOverlay();
    }
  }
}

/* ---------- 绘制 ---------- */

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8ecdf5');
  g.addColorStop(0.62, '#c8e9fb');
  g.addColorStop(1, '#e6f6e0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const c of clouds) {
    const cx = ((c.x - dist * 0.3) % (W + 120) + W + 120) % (W + 120) - 60;
    ctx.beginPath();
    ctx.ellipse(cx, c.y, 26 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 20 * c.s, c.y + 4 * c.s, 18 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 20 * c.s, c.y + 5 * c.s, 15 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFarMountains() {
  // 淡青远山，低对比，两层纵深
  ctx.fillStyle = 'rgba(155,205,175,.38)';
  for (const f of farHills) {
    const fx = ((f.x - dist * 0.12) % (W + 400) + W + 400) % (W + 400) - 200;
    ctx.beginPath();
    ctx.moveTo(fx, H - GROUND_H);
    ctx.quadraticCurveTo(fx + f.w / 2, H - GROUND_H - f.h, fx + f.w, H - GROUND_H);
    ctx.lineTo(fx + f.w, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawHills() {
  ctx.fillStyle = 'rgba(84,150,84,.35)';
  for (const h of hills) {
    const hx = ((h.x - dist * 0.5) % (W + 320) + W + 320) % (W + 320) - 160;
    ctx.beginPath();
    ctx.moveTo(hx, H - GROUND_H);
    ctx.quadraticCurveTo(hx + h.w / 2, H - GROUND_H - h.h, hx + h.w, H - GROUND_H);
    ctx.lineTo(hx + h.w, H - GROUND_H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBambooSegment(x, topY, bottomY) {
  if (topY >= H - GROUND_H || bottomY <= 0) return;
  // 竹竿本体：黄绿渐变（偏黄，和青蛙的翠绿区分开）
  const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  g.addColorStop(0, '#a3b84f');
  g.addColorStop(0.4, '#c4d76b');
  g.addColorStop(1, '#7d9440');
  ctx.fillStyle = g;
  ctx.fillRect(x, topY, PIPE_W, bottomY - topY);
  // 竹竿凹槽纹理（每节两条竖线）
  ctx.strokeStyle = 'rgba(60,80,25,.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + PIPE_W * 0.32, topY); ctx.lineTo(x + PIPE_W * 0.32, bottomY);
  ctx.moveTo(x + PIPE_W * 0.68, topY); ctx.lineTo(x + PIPE_W * 0.68, bottomY);
  ctx.stroke();
  // 竹节环：浅色凸起 + 上下深色收边
  const seg = 44;
  const start = Math.ceil(topY / seg) * seg;
  for (let y = start; y < bottomY; y += seg) {
    ctx.fillStyle = 'rgba(215,228,158,.55)';
    ctx.fillRect(x + 2, y - 3, PIPE_W - 4, 6);
    ctx.strokeStyle = 'rgba(45,65,18,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 2, y - 3); ctx.lineTo(x + PIPE_W - 2, y - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + PIPE_W - 2, y + 3); ctx.stroke();
  }
  // 两侧深色描边：边界和碰撞完全一致
  ctx.strokeStyle = 'rgba(30,50,18,.9)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, topY, PIPE_W - 2, bottomY - topY);
  // 顶部斜切口（内壁浅色）
  ctx.fillStyle = '#eef3cf';
  ctx.beginPath();
  ctx.ellipse(x + PIPE_W / 2, topY, PIPE_W / 2 - 4, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(30,50,18,.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawPipes() {
  for (const p of pipes) {
    const top = p.gapC - p.gap / 2, bot = p.gapC + p.gap / 2;
    drawBambooSegment(p.x, -4, top);
    drawBambooSegment(p.x, bot, H - GROUND_H + 4);
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCoin(x, y, t) {
  const sq = 1 + Math.sin(t * 0.18) * 0.1;   // 呼吸缩放
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sq, sq);
  // 金色圆 + 高光
  const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 12);
  g.addColorStop(0, '#fde68a');
  g.addColorStop(1, '#d97706');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2; ctx.stroke();
  // 铜钱方孔
  ctx.fillStyle = '#b45309';
  ctx.fillRect(-3.5, -3.5, 7, 7);
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1;
  ctx.strokeRect(-3.5, -3.5, 7, 7);
  ctx.restore();
}

function drawHeart(x, y, t) {
  const s = 1 + Math.sin(t * 0.2) * 0.08;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-10, -3, -7, -10, 0, -4);
  ctx.bezierCurveTo(7, -10, 10, -3, 0, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.arc(-3, -4, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGhost(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(167,139,250,.9)';
  ctx.shadowBlur = 12;
  // 药水瓶身
  ctx.fillStyle = 'rgba(139,92,246,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  // 瓶颈
  ctx.fillStyle = '#a78bfa';
  ctx.fillRect(-3.5, -7, 7, 5);
  // 瓶塞
  ctx.fillStyle = '#6d28d9';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // 问号
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 2.5);
  ctx.restore();
}

function drawPlusPotion(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(74,222,128,.9)';
  ctx.shadowBlur = 12;
  // 绿色药水瓶身：加一（永久 +1）
  ctx.fillStyle = 'rgba(34,197,94,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(-3.5, -7, 7, 5);
  ctx.fillStyle = '#15803d';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // "+" 标记
  ctx.fillStyle = '#fff';
  ctx.fillRect(-1.6, -3, 3.2, 8);
  ctx.fillRect(-4, 0.6, 8, 3.2);
  ctx.restore();
}

function drawDoublePotion(x, y, t) {
  const bob = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = 'rgba(251,146,60,.9)';
  ctx.shadowBlur = 12;
  // 橙色药水瓶身：加倍（×2）
  ctx.fillStyle = 'rgba(249,115,22,.92)';
  rr(-8, -3, 16, 13, 4); ctx.fill();
  ctx.fillStyle = '#fb923c';
  ctx.fillRect(-3.5, -7, 7, 5);
  ctx.fillStyle = '#c2410c';
  ctx.fillRect(-4.5, -11, 9, 5);
  ctx.shadowBlur = 0;
  // "×2" 标记
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('×2', 0, 2.5);
  ctx.restore();
}

function drawItems() {
  for (const it of items) {
    if (it.type === 'coin') drawCoin(it.x, it.y, it.t);
    else if (it.type === 'heart') drawHeart(it.x, it.y, it.t);
    else if (it.type === 'ghost') drawGhost(it.x, it.y, it.t);
    else if (it.type === 'plus') drawPlusPotion(it.x, it.y, it.t);
    else drawDoublePotion(it.x, it.y, it.t);
  }
}

function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, Math.max(0, f.life * 1.4));
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawFrog() {
  const fx = FROG_X + frog.w / 2;
  const fy = frog.y + frog.h / 2;
  const stretch = 1 + frog.flapT * 0.14;
  if (invincible > 0) ctx.globalAlpha = Math.sin(elapsed * 0.45) > 0 ? 0.35 : 0.8;
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(frog.rot);
  ctx.scale(2 - stretch, stretch);
  // 后腿（点击时收拢，下落张开）
  const spread = frog.flapT > 0.3 ? 5 : 9;
  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.ellipse(-9, -3, 4.5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -3, 4.5, 3, 0.5, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.ellipse(0, -8, 10, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(6,78,59,.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // 腹部
  ctx.fillStyle = '#bbf7d0';
  ctx.beginPath(); ctx.ellipse(0, -5.5, 6.5, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 凸眼 + 瞳孔（扑腾时睁大）
  const pr = frog.flapT > 0.3 ? 4.6 : 4;
  const cw = frog.flapT > 0.3 ? 2.2 : 1.8;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5.5, -16, pr, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -16, pr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.beginPath(); ctx.arc(-5, -15.5, cw, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -15.5, cw, 0, Math.PI * 2); ctx.fill();
  // 微笑
  ctx.strokeStyle = '#064e3b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -9, 5, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  // 前腿
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(-8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawGround() {
  ctx.fillStyle = '#4d7c0f';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#65a30d';
  ctx.fillRect(0, H - GROUND_H, W, 8);
  ctx.strokeStyle = 'rgba(236,253,245,.5)';
  ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 46) {
    const gx = ((x - dist) % (W + 92) + W + 92) % (W + 92) - 46;
    ctx.beginPath();
    ctx.moveTo(gx, H - 30);
    ctx.lineTo(gx - 6, H - 20);
    ctx.moveTo(gx, H - 30);
    ctx.lineTo(gx + 6, H - 20);
    ctx.stroke();
  }
}

function draw() {
  drawSky();
  drawClouds();
  drawFarMountains();
  drawHills();
  drawPipes();
  drawItems();
  drawFrog();
  drawFloats();
  drawGround();
}

function loop(t) {
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / (1000 / 60);
  lastTime = t;
  if (dt > 3) dt = 3;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 排行榜 ---------- */

function loadBoard() {
  rankList.innerHTML = '<li class="empty">加载中…</li>';
  fetch('/api/scores?game=flappy&limit=10')
    .then(r => r.json())
    .then(list => {
      if (!Array.isArray(list) || list.length === 0) {
        rankList.innerHTML = '<li class="empty">还没有人上榜，等你来破</li>';
        return;
      }
      const me = (nickInput.value || '').trim();
      rankList.innerHTML = '';
      list.forEach((row, i) => {
        const li = document.createElement('li');
        if (i < 3) li.innerHTML = '<span class="rk top">' + (i + 1) + '</span>';
        else li.innerHTML = '<span class="rk">' + (i + 1) + '</span>';
        li.innerHTML += '<span class="nk"></span><span class="sc"></span>';
        li.querySelector('.nk').textContent = row.nick;
        li.querySelector('.sc').textContent = row.score + ' 分';
        if (me && row.nick === me) li.classList.add('me');
        rankList.appendChild(li);
      });
    })
    .catch(() => { rankList.innerHTML = '<li class="empty">排行榜暂时加载失败</li>'; });
}

function showOverlay() {
  finalScore.textContent = String(score);
  bestScore.textContent = String(best);
  overlay.classList.add('show');
  loadBoard();
}

function submitScore() {
  const nick = nickInput.value.trim();
  if (!nick || submitted) return;
  submitted = true;
  submitBtn.disabled = true;
  submitBtn.textContent = '提交中…';
  try { localStorage.setItem('flappyNick', nick); } catch (e) {}
  fetch('/api/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: 'flappy', nick: nick, score: score })
  })
    .then(r => {
      if (r.status === 201) { submitBtn.textContent = '已上榜'; loadBoard(); }
      else if (r.status === 429) { submitBtn.textContent = '太频繁啦'; submitted = false; submitBtn.disabled = false; }
      else { submitBtn.textContent = '失败，重试'; submitted = false; submitBtn.disabled = false; }
    })
    .catch(() => { submitBtn.textContent = '失败，重试'; submitted = false; submitBtn.disabled = false; });
}

/* ---------- 事件 ---------- */

stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'over') return;
  flap();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'over') return;
    flap();
  }
});

submitBtn.addEventListener('click', e => { e.stopPropagation(); submitScore(); });
nickInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') submitScore(); });
restartBtn.addEventListener('click', e => { e.stopPropagation(); resetGame(); });

initScenery();
resetGame();
paintLegendIcons();
requestAnimationFrame(loop);

/* ---------- 道具图鉴：复用游戏绘制函数，保证图标与游戏内一致 ---------- */
function paintLegendIcons() {
  document.querySelectorAll('.lg-icon').forEach(cv => {
    const lc = cv.getContext('2d');
    lc.scale(2, 2);
    lc.translate(22, 22);
    const saved = ctx;
    ctx = lc;
    const type = cv.dataset.item, t = 16;
    if (type === 'coin') drawCoin(0, 0, t);
    else if (type === 'heart') drawHeart(0, 0, t);
    else if (type === 'ghost') drawGhost(0, 0, t);
    else if (type === 'plus') drawPlusPotion(0, 0, t);
    else drawDoublePotion(0, 0, t);
    ctx = saved;
  });
}
