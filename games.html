<meta name="description" content="余常进的个人主页 - 小游戏：猜数字、涂鸦跳跃" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:      '#09090b',
        card:    '#0c0c0e',
        line:    '#262626',
        soft:    '#a3a3a3',
        dim:     '#71717a',
        brand:   '#3b82f6',
        brand2:  '#38bdf8',
      },
      fontFamily: {
        sans: ['Inter', '"Noto Sans SC"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
      },
    },
  },
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  ::selection { background: rgba(59,130,246,.35); color:#fff; }
  html { color-scheme: dark; }
  body { background:#09090b; }
  .page-glow {
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:60%; height:280px; border-radius:9999px;
    background:linear-gradient(90deg,#38bdf8,#3b82f6);
    filter:blur(10rem); opacity:.12; pointer-events:none;
  }
  .text-gradient { background:linear-gradient(90deg,#38bdf8,#3b82f6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn-primary { background:#3b82f6; color:#fff; transition:all .3s ease; }
  .btn-primary:hover { background:#2563eb; transform:translateY(-2px); box-shadow:0 8px 30px -8px rgba(59,130,246,.5); }
  .btn-ghost { transition:all .3s ease; }
  .btn-ghost:hover { background:rgba(255,255,255,.06); transform:translateY(-2px); }
  .vcard { background:#0c0c0e; border:1px solid #262626; border-radius:1rem; transition:all .3s ease; }
  .vcard:hover { transform:translateY(-4px); border-color:rgba(59,130,246,.4); box-shadow:0 10px 40px -10px rgba(59,130,246,.15); }
  .fade-up { opacity:0; transform:translateY(20px); animation:fadeUp .8s ease forwards; }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}
  @media (prefers-reduced-motion: reduce) { .fade-up{animation:none;opacity:1;transform:none} html{scroll-behavior:auto} }
  input:focus { outline:none; border-color:rgba(59,130,246,.6); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
</style>
</head>
<body class="font-sans text-neutral-200 antialiased overflow-x-hidden">

<header class="sticky top-0 w-full h-16 bg-bg/80 backdrop-blur-sm z-50 border-b border-line/60">
  <nav class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
    <a href="./index.html" class="flex items-center gap-2 text-lg font-semibold text-white tracking-tight">
      <svg class="w-5 h-5 text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 2-8-8 2-3.5 3.5a2.5 2.5 0 0 0 3 3L16 16Z"/><path d="M4 20 8.5 15.5"/></svg>
      余常进
    </a>
    <div class="flex items-center gap-6 text-sm font-medium text-soft">
      <a href="./index.html" class="hover:text-white transition-colors">← 返回主页</a>
      <a href="#guess" class="hidden sm:inline hover:text-white transition-colors">猜数字</a>
      <a href="#doodle" class="hidden sm:inline hover:text-white transition-colors">涂鸦跳跃</a>
    </div>
  </nav>
</header>

<section class="relative pt-20 pb-12 text-center">
  <div class="page-glow"></div>
  <div class="max-w-6xl mx-auto px-6 flex flex-col items-center gap-y-4">
    <h1 class="fade-up d1 text-3xl lg:text-5xl font-bold text-white !leading-tight">摸鱼<span class="text-gradient">小游戏</span></h1>
    <p class="fade-up d2 text-sm text-soft">两个纯前端小游戏，均支持桌面与移动端</p>
  </div>
</section>

<section class="pb-24">
  <div class="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-6">

    <div id="guess" class="vcard p-8">
      <h3 class="font-semibold text-white text-lg mb-2">🎯 猜数字</h3>
      <p class="text-soft text-sm mb-6">我心里想了一个 1 ~ 100 的数，看你几步能猜中</p>
      <div class="flex gap-3">
        <input id="guessInput" type="number" min="1" max="100" placeholder="1 - 100"
          class="flex-1 rounded-md bg-bg border border-line px-4 py-2.5 text-sm text-white placeholder:text-dim transition-all" />
        <button id="guessBtn" class="btn-primary rounded-md text-sm font-semibold px-6 py-2.5">猜</button>
      </div>
      <p id="guessMsg" class="text-sm text-soft mt-5 h-5">输入数字开始挑战 ↓</p>
      <div class="mt-4 flex items-center justify-between text-xs text-dim">
        <span>已猜次数：<span id="guessCount" class="text-brand2">0</span></span>
        <button id="guessReset" class="btn-ghost rounded px-2 py-1">重新开始</button>
      </div>
    </div>

    <div id="doodle" class="vcard p-8">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-semibold text-white text-lg">🐸 涂鸦跳跃</h3>
        <span class="text-xs text-dim">得分：<span id="gameScore" class="text-brand2">0</span></span>
      </div>
      <p class="text-soft text-sm mb-4">← → 或 A/D 移动，手机端点按画布左右两侧，掉落到底部可重新开始</p>
      <canvas id="doodleCanvas" width="320" height="420"
        class="w-full max-w-[320px] mx-auto rounded-lg border border-line bg-bg touch-none cursor-pointer"></canvas>
      <div class="mt-4 text-center">
        <button id="gameReset" type="button" class="btn-ghost rounded px-3 py-1.5 text-xs text-soft">重新开始</button>
      </div>
    </div>

  </div>
</section>

<footer class="border-t border-line/60 py-10">
  <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-dim">
    <p>© 2026 余常进</p>
    <a href="./index.html" class="hover:text-white transition-colors">← 返回主页</a>
  </div>
</footer>

<script>
/* 游戏 1：猜数字 */
let secret = 0, guessTimes = 0;
const guessInput = document.getElementById('guessInput');
const guessMsg   = document.getElementById('guessMsg');
const guessCount = document.getElementById('guessCount');

function newGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  guessTimes = 0;
  guessCount.textContent = '0';
  guessMsg.textContent = '输入数字开始挑战 ↓';
  guessMsg.className = 'text-sm text-soft mt-5 h-5';
  guessInput.value = '';
}
newGame();

document.getElementById('guessBtn').addEventListener('click', () => {
  const v = Number(guessInput.value);
  if (!v || v < 1 || v > 100) { guessMsg.textContent = '请输入 1 ~ 100 之间的数字'; return; }
  guessTimes++;
  guessCount.textContent = guessTimes;
  if (v === secret) {
    guessMsg.textContent = `🎉 猜对了！就是 ${secret}，共用了 ${guessTimes} 次`;
    guessMsg.className = 'text-sm text-brand2 mt-5 h-5';
  } else if (v < secret) {
    guessMsg.textContent = `↗ 偏小了，往大猜`;
    guessMsg.className = 'text-sm text-amber-400 mt-5 h-5';
  } else {
    guessMsg.textContent = `↘ 偏大了，往小猜`;
    guessMsg.className = 'text-sm text-sky-400 mt-5 h-5';
  }
  guessInput.value = '';
});
guessInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('guessBtn').click(); } });
document.getElementById('guessReset').addEventListener('click', newGame);

/* 游戏 2：涂鸦跳跃（Canvas）。人物/平台为几何占位，可替换成素材图 */
const canvas = document.getElementById('doodleCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('gameScore');

const W = canvas.width, H = canvas.height;
const GRAVITY = 0.32, JUMP = -10.5, MOVE = 4.2;
const MAX_FOLLOW = 12;   // 相机平滑跟随：每 60fps 帧最多追 12px
let lastTime = 0;

let player, platforms, score, cameraY, gameOver, keys = { left:false, right:false };

function initGame() {
  player = { x: W/2 - 10, y: H - 80, w: 20, h: 20, vy: 0 };
  platforms = [];
  score = 0; cameraY = 0; gameOver = false;
  scoreEl.textContent = '0';
  platforms.push({ x: W/2 - 30, y: H - 40, w: 60 });
  for (let i = 1; i <= 14; i++) {
    platforms.push({
      x: Math.random() * (W - 60),
      y: H - 40 - i * 55 - Math.random() * 25,
      w: 55 + Math.random() * 15,
    });
  }
}

function spawnPlatforms() {
  let top = Math.min(...platforms.map(p => p.y));
  while (top > -60) {   // 保证屏幕上方始终有新平台可踩
    top -= 55 + Math.random() * 25;
    platforms.push({
      x: Math.random() * (W - 60),
      y: top,
      w: 55 + Math.random() * 15,
    });
  }
  platforms = platforms.filter(p => p.y < H + 60);   // 清理屏幕下方外的旧平台
}

function updateGame(dt) {
  if (gameOver) return;
  if (keys.left)  player.x -= MOVE * dt;
  if (keys.right) player.x += MOVE * dt;
  if (player.x < -player.w) player.x = W;
  if (player.x > W) player.x = -player.w;

  player.vy += GRAVITY * dt;
  player.y  += player.vy * dt;

  if (player.vy > 0) {
    for (const p of platforms) {
      if (player.x + player.w > p.x && player.x < p.x + p.w &&
          player.y + player.h > p.y && player.y + player.h - player.vy * dt <= p.y + 6) {
        player.vy = JUMP;
        break;
      }
    }
  }
  const line = H * 0.4;   // 跟随线固定在屏幕 40% 高度（原 bug：line= cameraY+H*0.4 混用世界/屏幕坐标，跟随线会漂出屏幕，导致小球跑出屏外视角也不跟）
  if (player.y < line) {
    // 平滑跟随：每帧最多移动 MAX_FOLLOW*dt，视角不会瞬移甩开小球
    const dy = Math.min(line - player.y, MAX_FOLLOW * dt);
    cameraY -= dy;
    player.y += dy;
    platforms.forEach(p => p.y += dy);
    score += Math.round(dy);
    scoreEl.textContent = score;
    spawnPlatforms();
  }
  if (player.y > H + 40) {   // 掉出屏幕底部判定（屏幕坐标）
    gameOver = true;
  }
}

function drawGame() {
  ctx.clearRect(0, 0, W, H);
  // 背景网格
  ctx.strokeStyle = 'rgba(38,38,38,.6)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 平台（蓝色圆角矩形）
  ctx.fillStyle = '#3b82f6';
  platforms.forEach(p => {
    if (p.y > -20 && p.y < H + 20) {
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, 8, 4);
      ctx.fill();
    }
  });

  // 人物（天蓝方块 + 眼睛）
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.w, player.h, 6);
  ctx.fill();
  ctx.fillStyle = '#09090b';
  ctx.fillRect(player.x + 4,  player.y + 6, 3, 3);
  ctx.fillRect(player.x + 13, player.y + 6, 3, 3);

  if (gameOver) {
    ctx.fillStyle = 'rgba(9,9,11,.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#a3a3a3';
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('掉下去啦！得分 ' + score, W/2, H/2 - 10);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('点击画布重新开始', W/2, H/2 + 16);
  }
}

function loop(t) {
  // 帧率归一化：以 60fps 为基准，高分屏(120/144Hz)不再让游戏速度翻倍
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / (1000 / 60);
  lastTime = t;
  if (dt < 0.001) dt = 0.001;
  if (dt > 3) dt = 3;   // 切后台回来时防止巨帧跳变
  updateGame(dt);
  drawGame();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
canvas.addEventListener('pointerdown', e => {
  if (gameOver) { initGame(); return; }
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  if (cx < rect.width / 2) keys.left = true; else keys.right = true;
});
canvas.addEventListener('pointerup', () => { keys.left = false; keys.right = false; });
canvas.addEventListener('pointerleave', () => { keys.left = false; keys.right = false; });
document.getElementById('gameReset').addEventListener('click', initGame);

initGame();
requestAnimationFrame(loop);   // 直接交给 rAF 启动，确保首帧拿到时间戳（同步调 loop() 会因 t=undefined 拿到 NaN 的 dt）
</script>

</body>
</html>
